name = "pookiepied-auth"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Public: OAuth callbacks have to be reachable by Google and by the browser.
routes = [{ pattern = "auth.pookiepied.dev", custom_domain = true }]

# Deploy checklist, ADR-0001. Never flip these to true.
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "IDENTITY"
database_name = "pookiepied-identity"
database_id = "REPLACE_ME"
migrations_dir = "migrations"

tail_consumers = [{ service = "pookiepied-telemetry" }]

[vars]
SESSION_TTL_DAYS = "30"
OAUTH_REDIRECT_URI = "https://auth.pookiepied.dev/oauth/callback"

# Secrets — set with `wrangler secret put`, never in this file:
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET

# Cleanup + heartbeat. Without this the `scheduled` handler in src/index.ts
# never runs, expired flows accumulate forever, and the console has no way to
# tell a healthy service from a deleted one.
[triggers]
crons = ["*/5 * * * *"]
