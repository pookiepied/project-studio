name = "studio-context-engine"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[vars]
ENVIRONMENT = "production"

# Studio Registry - what exists for this user.
[[services]]
binding = "REGISTRY"
service = "studio-registry"

# Studio Data - conversations, attachments, files.
[[services]]
binding = "DATA"
service = "studio-data"

[[services]]
binding = "TOOL_POOL"
service = "studio-tool-pool"

[[d1_databases]]
binding = "CONTEXT_DB"
database_name = "studio-context-engine"
database_id = "00000000-0000-0000-0000-000000000000"

[[services]]
binding = "CONNECTORS"
service = "connectors"

[[services]]
binding = "MCP"
service = "studio-mcp"
