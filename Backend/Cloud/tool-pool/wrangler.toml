name = "studio-tool-pool"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "TOOL_POOL_DB"
database_name = "studio-tool-pool"
database_id = "00000000-0000-0000-0000-000000000000"

[[services]]
binding = "REGISTRY"
service = "studio-registry"

[[services]]
binding = "CONNECTORS"
service = "connectors"

[[services]]
binding = "SKILL_LIBRARY"
service = "studio-skill-library"

[[services]]
binding = "AGENT_LIBRARY"
service = "studio-agent-library"

