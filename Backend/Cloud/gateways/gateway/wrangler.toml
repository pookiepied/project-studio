name = "studio-gateway"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[vars]
ENVIRONMENT = "production"
CF_ACCOUNT_ID = "9daf0e95e03cc8f9463f0d67a6c7c959"
CF_AIG_GATEWAY_NAME = "studio-gateway"
CF_AIG_BYOK_ALIAS = "production"

[[kv_namespaces]]
binding = "CREDITS_KV"
id = "replace-with-credits-kv-id"

[[kv_namespaces]]
binding = "MODEL_REGISTRY_KV"
id = "replace-with-model-registry-kv-id"

# Secrets:
#   wrangler secret put CF_AIG_TOKEN
#   wrangler secret put REGISTRY_MANAGEMENT_TOKEN
