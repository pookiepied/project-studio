name = "studio-gateway"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[vars]
ENVIRONMENT = "production"
CF_ACCOUNT_ID = "9daf0e95e03cc8f9463f0d67a6c7c959"
CF_AIG_GATEWAY_NAME = "studio-gateway"
CF_AIG_BYOK_ALIAS = "production"

# Studio Gateway is a private worker: no workers.dev subdomain and no custom
# route (workers_dev / preview_urls are disabled above). It is invoked only
# through a Cloudflare service binding from the public API, which owns end-user
# authentication. This worker performs no inbound end-user auth of its own.
#
# Secrets (never committed):
#   wrangler secret put CF_AIG_TOKEN
