name = "api"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[vars]
ENVIRONMENT = "production"

# Studio Execution Runtime — main agent loop and live run sessions.
[[services]]
binding = "EXECUTION_RUNTIME"
service = "studio-execution-runtime"

# Studio Planner Runtime — planning loop. Mounted after planner runtime is ready.
[[services]]
binding = "PLANNER_RUNTIME"
service = "studio-planner-runtime"

# Studio Data — conversations, uploads, generated artifacts, metadata.
[[services]]
binding = "DATA"
service = "studio-data"

[[services]]
binding = "REGISTRY"
service = "studio-registry"

# Revoked JWT tokens — checked at API edge before identity is forwarded.
[[kv_namespaces]]
binding = "REVOKED_KV"
id = "720a294c0a5844248a4ee8ac6a91fa8f"

[build]
command = "npm install && npx tsc"
