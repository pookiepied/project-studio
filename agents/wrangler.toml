name = "studio-agents"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[vars]
ENVIRONMENT = "production"

# ---------------------------------------------------------------------------
# Secrets — set via: wrangler secret put <NAME>
# ---------------------------------------------------------------------------
# MEMORY_AUTH_SECRET   — shared secret for service-to-service auth with studio-mcp-memory.
#                        Must match MEMORY_AUTH_SECRET in studio-mcp-memory.
#   wrangler secret put MEMORY_AUTH_SECRET

# ---------------------------------------------------------------------------
# D1 — agents-owned database (separate from studio-ai / studio-chat)
# Setup:  wrangler d1 create studio-agents-db
# Schema: wrangler d1 execute studio-agents-db --remote --file=./schema.sql
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "AGENTS_DB"
database_name = "studio-agents"
database_id = "REPLACE_WITH_REAL_ID"

# ---------------------------------------------------------------------------
# Service Bindings
# ---------------------------------------------------------------------------

# MCP tool hub — all cloud tool calls go through here
[[services]]
binding = "MCP_TOOLS"
service  = "studio-mcp"

# Centralized telemetry
[[services]]
binding = "TRACKER"
service  = "tracker"

# LLM gateway — handles provider routing and API keys
[[services]]
binding = "GATEWAY"
service  = "studio-gateway"

# Memory — context injection at agent loop start
[[services]]
binding = "MEMORY"
service  = "studio-mcp-memory"

# Tail consumer
[[tail_consumers]]
service = "tracker"

# ---------------------------------------------------------------------------
# KV — MCP tool manifests (mcp_manifest:{name}). Shared namespace with chat;
# read by the tool loader for local/remote MCP tool schemas.
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "MCP_KV"
id = "2ad99d3c8750412fa2465f255a5d22a1"

# ---------------------------------------------------------------------------
# Durable Objects
# ---------------------------------------------------------------------------
[[durable_objects.bindings]]
name       = "BLACKBOARD"
class_name = "BlackboardDO"

[[durable_objects.bindings]]
name       = "RESEARCH_AGENT"
class_name = "ResearchAgent"

# Durable Object migrations are an APPEND-ONLY ledger — Cloudflare replays them
# in order against the deployed worker. OmniAgent/CodingAgent were real classes
# that shipped earlier; v3 deleted them. These historical tags MUST stay exactly
# as-is (do not collapse or remove) or the next deploy fails a migration check.
# Only the current classes (v4 BlackboardDO, v5 ResearchAgent) exist at runtime.
[[migrations]]
tag              = "v1"
new_sqlite_classes = ["OmniAgent"]

[[migrations]]
tag              = "v2"
new_sqlite_classes = ["CodingAgent"]

[[migrations]]
tag              = "v3"
deleted_classes  = ["OmniAgent", "CodingAgent"]

[[migrations]]
tag              = "v4"
new_sqlite_classes = ["BlackboardDO"]

[[migrations]]
tag              = "v5"
new_sqlite_classes = ["ResearchAgent"]

[build]
command = "npm install && npx tsc --noEmit"
