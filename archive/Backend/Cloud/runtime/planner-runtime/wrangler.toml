name = "studio-planner-runtime"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[vars]
ENVIRONMENT = "production"

# Gateway — all model access goes through the gateway, never direct providers.
[[services]]
binding = "GATEWAY"
service = "studio-gateway"

# Studio Context Engine - task-specific context projections (planner consumer).
[[services]]
binding = "CONTEXT"
service = "studio-context-engine"

# Studio Data — durable plan persistence.
[[services]]
binding = "DATA"
service = "studio-data"

# Studio MCP hub — read-only cloud tools used while planning.
[[services]]
binding = "MCP"
service = "studio-mcp"

[[services]]
binding = "TOOL_POOL"
service = "studio-tool-pool"

[[services]]
binding = "TOOL_EXECUTION"
service = "studio-tool-execution"

# Durable Object: one PlannerSession per conversation.
[[durable_objects.bindings]]
name = "PLANNER_SESSION"
class_name = "PlannerSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PlannerSession"]
