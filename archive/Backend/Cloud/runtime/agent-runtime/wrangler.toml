name = "studio-agent-runtime"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[vars]
ENVIRONMENT = "production"

# Gateway — all model access goes through the gateway, never direct providers.
[[services]]
binding = "GATEWAY"
service = "studio-gateway"

# Studio Registry — agent definitions.
[[services]]
binding = "REGISTRY"
service = "studio-registry"

# Studio Context Engine - capability resolution for the agent.
[[services]]
binding = "CONTEXT"
service = "studio-context-engine"

# Studio Data — durable result/transcript persistence.
[[services]]
binding = "DATA"
service = "studio-data"

# Studio MCP hub — cloud tool execution for permitted tools.
[[services]]
binding = "MCP"
service = "studio-mcp"

[[services]]
binding = "TOOL_POOL"
service = "studio-tool-pool"

[[services]]
binding = "TOOL_EXECUTION"
service = "studio-tool-execution"

# Durable Object: one AgentSession per agent invocation/conversation.
[[durable_objects.bindings]]
name = "AGENT_SESSION"
class_name = "AgentSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentSession"]
