<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#121212" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      /* Standard-window framing lives here so it paints before the JS/CSS
         bundles load. Transparent utility variants explicitly opt out. */
      html,
      html body {
        background: transparent !important;
      }

      html:not([data-window-surface]),
      html[data-window-surface="standard"] {
        --window-frame-color: var(--surface-border, #E6E6E6);
        --window-frame-bg: var(--surface-page, #FFFFFF);
      }

      html.dark[data-window-surface="standard"] {
        --window-frame-color: var(--surface-border, #2A2A2A);
        --window-frame-bg: var(--app-bg-dark, #121212);
      }

      html:not([data-window-surface]) #root,
      html[data-window-surface="standard"] #root {
        position: fixed;
        inset: var(--zen-frame-inset, 0px);
        border-radius: var(--zen-frame-radius, 12px);
        overflow: hidden;
        border: 0;
        background: var(--window-frame-bg);
        isolation: isolate;
        box-sizing: border-box;
        box-shadow:
          0 8px 28px -4px rgb(0 0 0 / 0.14),
          0 2px 8px -2px rgb(0 0 0 / 0.08);
      }

      html.dark[data-window-surface="standard"] #root {
        box-shadow:
          0 8px 28px -4px rgb(0 0 0 / 0.50),
          0 2px 8px -2px rgb(0 0 0 / 0.30);
      }

      /* Descendants can cover a root border in the frameless WebView. Keep the
         visible frame as the root's final, topmost paint layer instead. */
      html:not([data-window-surface]) #root::after,
      html[data-window-surface="standard"] #root::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 2147483647;
        pointer-events: none;
        border: 4px solid var(--window-frame-color);
        border-radius: inherit;
        box-sizing: border-box;
      }

      html[data-window-surface="transparent-widget"] #root,
      html[data-window-surface="floating-utility"] #root,
      html[data-window-surface="overlay"] #root {
        position: fixed;
        inset: 0;
        overflow: visible;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }

      html[data-window-surface="transparent-widget"] #root::after,
      html[data-window-surface="floating-utility"] #root::after,
      html[data-window-surface="overlay"] #root::after {
        content: none;
      }

      /* .zen-surface is now a transparent pass-through — #root owns the
         window outline. Kept only so existing layout classes still apply. */
      .zen-surface {
        position: fixed;
        inset: var(--zen-frame-inset, 0px);
        background: transparent;
        border: none;
        box-shadow: none;
      }
    </style>

    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var isOverlay = params.get('w') === 'overlay';
          var isSplashPreview = params.get('splashPreview') === '1';
          var root = document.documentElement;

          root.dataset.windowSurface = isOverlay
            ? 'transparent-widget'
            : (params.get('surface') || 'standard');

          if (isOverlay) {
            root.classList.add('overlay-window');
          }

          var storedTheme = localStorage.getItem('studio-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (storedTheme === 'dark' || (!storedTheme && prefersDark) || (storedTheme === 'system' && prefersDark)) {
            root.classList.add('dark');
          }

          var shellMode = localStorage.getItem('studio-shell-mode');
          var legacyShellMode = localStorage.getItem('studio-experiment-shell');
          var workspaceShellEnabled = shellMode
            ? shellMode !== 'standard'
            : legacyShellMode !== 'classic';
          if (!isOverlay && !isSplashPreview && workspaceShellEnabled) {
            root.classList.add('zen-window');
            root.style.setProperty('--zen-frame-inset', '0px');
            root.style.setProperty('--zen-frame-radius', '12px');
          }
        } catch(e) {}
      })();
    </script>

    <!--
      Fonts are self-hosted via @fontsource — bundled into the app, no network requests.
      Imported in main.tsx: Inter Variable (UI/body), Newsreader Variable (display/headings),
      Cascadia Code (mono).
    -->

    <!-- Note: CSP is managed by Tauri's tauri.conf.json for desktop app -->
    <title>STUDIO</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
