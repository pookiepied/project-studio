name = "studio-mcp-library"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[vars]
ENVIRONMENT = "production"

# Public origin that serves the gateway's /v1/images/:id route. Replaces chat's
# request-scoped getRequestBaseUrl(); must match where generated images are
# publicly reachable. Verify against your deployment's domain.
PUBLIC_IMAGE_BASE = "https://api.pookiepied.dev"

# Model used to extract facts, entities, and summaries from conversations.
# Routed through your AI worker — any model in your catalog works here.
# Verify the exact ID against your KV model catalog before deploying.
EXTRACT_MODEL = "openrouter:xiaomi/mimo-v2.5"

# Workers AI embedding model. Must match the Vectorize index dimensions below.
# @cf/baai/bge-base-en-v1.5  → 768 dimensions (default, fast)
# @cf/baai/bge-large-en-v1.5 → 1024 dimensions (slower, more accurate)
EMBED_MODEL = "@cf/baai/bge-base-en-v1.5"

# Max tokens to spend on the memory block injected into the system prompt.
INJECT_TOKEN_BUDGET = "800"

# Number of recent conversation summaries always injected (time-based, no vector).
INJECT_RECENT_COUNT = "3"

# Number of semantically-matched memories to inject via vector search.
INJECT_SEMANTIC_COUNT = "5"

# ---------------------------------------------------------------------------
# Durable Objects — one binding per MCP server class, one worker.
# ---------------------------------------------------------------------------
[[durable_objects.bindings]]
name = "TOOLS_OBJECT"
class_name = "StudioToolsAgent"

[[durable_objects.bindings]]
name = "MEMORY_OBJECT"
class_name = "StudioMemoryAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StudioToolsAgent", "StudioMemoryAgent"]

# ---------------------------------------------------------------------------
# D1 — STUDIO Memory database
# Setup:  wrangler d1 create studio-memory
# Schema: wrangler d1 execute studio-memory --remote --file=./schema.sql
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "MEMORY_DB"
database_name = "studio-memory"
database_id = "171ce9b6-4d75-43c3-9b22-309656635658"

# ---------------------------------------------------------------------------
# Vectorize — one index per category, distinct bindings.
# ---------------------------------------------------------------------------
[[vectorize]]
binding = "MEMORY_VECTORIZE"
index_name = "studio-memory-vectors"

[[vectorize]]
binding = "RAG_VECTORIZE"
index_name = "studio-rag"

# ---------------------------------------------------------------------------
# Workers AI — shared embedding binding (memory profile embeddings, rag embeddings)
# ---------------------------------------------------------------------------
[ai]
binding = "AI"

# ---------------------------------------------------------------------------
# KV namespaces
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "PROFILE_KV"
id = "5b0ee001b49d433996bc02388b5dc29a"

[[kv_namespaces]]
binding = "MCP_KV"
id = "2ad99d3c8750412fa2465f255a5d22a1"

# ---------------------------------------------------------------------------
# R2 — generated image storage (studio-tools: image_generate)
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "studio-images"

# ---------------------------------------------------------------------------
# Service bindings
# ---------------------------------------------------------------------------
[[services]]
binding = "AI_WORKER"
service = "studio-gateway"

[[services]]
binding = "GATEWAY"
service = "studio-gateway"

[[services]]
binding = "TRACKER"
service = "tracker"

[[tail_consumers]]
service = "tracker"

# ---------------------------------------------------------------------------
# Secrets — set via: wrangler secret put <NAME>
#
# MEMORY_AUTH_SECRET   — shared secret for service-to-service auth on
#                        /services/studio-memory/*. Set the same value as
#                        MEMORY_AUTH_SECRET in the agents worker.
# TOOLS_AUTH_SECRET    — optional shared secret for /tools/studio-tools/*.
#                        Leave unset for internal-only (service-binding) access;
#                        the worker is workers_dev=false so it is not publicly
#                        reachable.
# TAVILY_API_KEY       — web_search primary provider.
# BRAVE_SEARCH_API_KEY — web_search fallback provider.
# ---------------------------------------------------------------------------

[build]
command = "npm install && npx tsc --noEmit"
