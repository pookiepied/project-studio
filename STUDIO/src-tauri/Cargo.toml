[package]
name = "studio"
version = "0.1.0"
description = "The Studio desktop client"
authors = ["pookiepied"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix may seem redundant but it is necessary to make the lib name
# unique so it does not conflict with the bin name. Windows only, see
# https://github.com/rust-lang/cargo/issues/8519
name = "studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `tray-icon` and `image-png` are what let the app keep a presence in the
# notification area: the first compiles the tray and its menu, the second
# decodes the PNG the icon is built from. Neither is on by default.
tauri = { version = "2.11.3", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"

# One app, however many times it is launched. Without this a second launch
# starts a second process with its own Harness child, and two supervisors then
# race for the same port and the same database. The plugin hands the argv of
# the launch that lost to the one that won, which is also how a click on a
# shortcut raises the window that already exists.
tauri-plugin-single-instance = "2"

# Launch at login, as a real registry entry under Windows' `Run` key rather
# than a flag the app checks. Enabling and disabling it is the plugin's job so
# that turning it off actually removes the entry - a stored `false` that
# leaves the entry behind is the version of this feature that lies.
tauri-plugin-autostart = "2"
# Preferences live in a real JSON file in the OS config directory, not in the
# webview's localStorage. localStorage is browser cache: it is scoped to the
# webview's origin, it is wiped by anything that clears site data, and it is
# invisible to the user -- so a stale value silently outranked the defaults for
# weeks with no way to see it or reset it. A file can be read, edited, backed
# up and deleted.
tauri-plugin-store = "2"

# The OS directory picker behind `Add folder` in the new-project dialog. One
# dialog, one operation: the capability grants only `dialog:allow-open` (see
# capabilities/default.json), and the version is pinned to match the npm side
# exactly because a picker whose two halves disagree is a picker that fails
# differently depending on which half answers first.
tauri-plugin-dialog = "=2.7.3"

# The HTTP client behind `service_fetch` (`services.rs`): harness traffic
# issued from Rust, carrying the bearer the supervisor minted. Plain HTTP to
# one loopback address, so no TLS backend is linked in -- a scheme this client
# cannot speak is one more place it cannot be steered into -- and no redirects
# are followed, so the credential cannot arrive anywhere but the origin the
# supervisor resolved.
#
# Replaces `tauri-plugin-http`: with the transport in a command, the webview
# no longer names URLs, so there was nothing left for the plugin to grant.
reqwest = { version = "0.12", default-features = false }

base64 = "0.22"
rand = "0.8"
os_pipe = "1.2"

# The service seam's async plumbing: `service_stream` runs a body-reader
# task and races it against a heartbeat and an idle deadline (`select!`),
# and the tests drive both commands (`#[tokio::test]`). Tauri already
# compiles tokio with rt/sync; `time` and `macros` add no crate the tests
# did not already pull in, and none of them link anything new.
# `process` is for one thing: asking the `tailscale` tool for the machine's
# MagicDNS name (`remote/addresses.rs`), under a deadline.
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "io-util", "process"] }

# The listener behind "Open on other devices" (`remote/`). Built straight on
# hyper rather than on a routing framework, because the routing this needs is
# one prefix test: `/api` and `/agents` are forwarded to the harness, and
# everything else is the frontend Tauri already embedded in the binary. All
# four of these were compiled into the tree already as reqwest's and Tauri's
# own dependencies, so the server costs no new crate -- which is the same
# reason `reqwest` is here with its defaults off. An HTTP router would have
# been one more thing to keep current in exchange for a `match` on a string.
#
# `server` and `http1` only: the listener speaks plain HTTP to devices on the
# home network or through Tailscale, and a scheme it cannot speak is one more
# place it cannot be steered into. HTTP/2 buys nothing here and TLS is
# Tailscale's job (ADR 0050 3.7).
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

# Paired-device credentials for the same listener (`remote/devices.rs`): the
# secret that each paired browser presents as its cookie never touches disk in
# plain text -- it goes to the OS credential store, the same place the
# harness's own keyring store (`STUDIO HARNESS/src/credentials/keyring-store.ts`)
# puts the session and provider keys, under the same service name. The Rust
# crate is a separate implementation of the same facility, because the
# listener lives here and the Node one cannot be reached from it.
#
# Only the platform backends Studio actually ships are enabled; the Linux
# Secret Service backend is left out deliberately (it would drag in D-Bus for
# a target this app does not build for), and on such a target pairing will
# fail loudly rather than silently degrade to a file.
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native"] }

# The pairing cookie's secret is stored only as its SHA-256, so a copy of the
# credential store does not admit anything. Already compiled into the tree
# transitively; this declares it for direct use.
sha2 = "0.10"

# The name the home network can type while "Open on other devices" is on
# (`remote/mdns.rs`): `studio.local`, published over mDNS when the listener
# starts and withdrawn when it stops. Pure Rust with no system daemon, one
# thread while it runs and none when it does not. Everything about remote
# access works without it -- the QR code and the raw address are the paths
# that always answer -- which is why the plan put this step last.
mdns-sd = "0.21"

# The machine's interfaces, read to choose which addresses the name should
# resolve to (`remote/mdns.rs`). Already in the tree as mdns-sd's own
# dependency, so declaring it costs no new crate.
if-addrs = "0.15"

# POSIX-only, and previously declared as if they were not -- which is why the
# Host crate had never compiled on Windows (meta-task #87). `command-fds` maps
# descriptors with `dup2` inside a `pre_exec` hook and fails inside its own
# source on a Windows target, before anything of ours is reached; `nix` is a
# libc binding by definition. Both are reachable only from `#[cfg(unix)]` code,
# so the declaration was the whole bug.
[target.'cfg(unix)'.dependencies]
command-fds = "0.2"
nix = { version = "0.27", features = ["process", "signal"] }

[target.'cfg(target_os = "windows")'.dependencies]
# `Win32_Graphics_Dwm` is the round-corner attribute for the outer window edge.
# `Win32_System_JobObjects` is the Windows counterpart to `process_group(0)`:
# the Harness and every process it starts are assigned to one Job Object with
# `JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE`, so an MCP child cannot outlive the Host
# holding a port or a file lock (meta-task #89).
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security", "Win32_System_JobObjects"] }

# The permission grant (`permissions.rs`): WebView2's PermissionRequested,
# answered by Studio instead of by a stall or by Edge's own prompt. The
# version tracks the copy already in this tree through Tauri's wry, so the
# controller the platform seam hands us and the interfaces this module
# registers against are one crate's, not two spellings of one set.
webview2-com = "0.38"
