[package]
name = "studio"
version = "0.1.0"
description = "The Studio desktop client"
authors = ["pookiepied"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix may seem redundant but it is necessary to make the lib name
# unique so it does not conflict with the bin name. Windows only, see
# https://github.com/rust-lang/cargo/issues/8519
name = "studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
# Preferences live in a real JSON file in the OS config directory, not in the
# webview's localStorage. localStorage is browser cache: it is scoped to the
# webview's origin, it is wiped by anything that clears site data, and it is
# invisible to the user -- so a stale value silently outranked the defaults for
# weeks with no way to see it or reset it. A file can be read, edited, backed
# up and deleted.
tauri-plugin-store = "2"
# Harness traffic goes through Rust rather than the webview's own fetch. The
# harness serves no CORS headers -- deliberately, since a loopback service
# holding provider credentials should not be reachable by any origin a browser
# is willing to preflight -- and the webview's origin is `http://tauri.localhost`,
# which is cross-origin to a loopback port. Every browser fetch therefore died
# at the preflight. A request issued from Rust has no origin and no preflight,
# so the question stops existing. The capability scopes it to loopback only;
# see `capabilities/default.json`.
tauri-plugin-http = "2"

[target.'cfg(target_os = "windows")'.dependencies]
# DWM round-corner attribute for the outer window edge.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
