[package]
name = "studio"
version = "0.1.0"
description = "The Studio desktop client"
authors = ["pookiepied"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix may seem redundant but it is necessary to make the lib name
# unique so it does not conflict with the bin name. Windows only, see
# https://github.com/rust-lang/cargo/issues/8519
name = "studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "windows")'.dependencies]
# DWM round-corner attribute for the outer window edge.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
