name = "studio-registry"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "REGISTRY_DB"
database_name = "studio-registry"
database_id = "replace-with-registry-db-id"

[[services]]
binding = "MCP"
service = "studio-mcp"
