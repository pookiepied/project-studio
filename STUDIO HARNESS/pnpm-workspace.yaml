packages:
  - .

allowBuilds:
  '@google/genai': false
  '@mongodb-js/zstd': false
  esbuild: true
  node-liblzma: false
  protobufjs: false
  sharp: false
  workerd: true

# The @flue/runtime and @flue/sdk idempotency patches were removed under
# meta-task #12. The @flue/cli patch died with the Flue 2.0 pins (Phases 2
# and 3): its three behaviours - the fd admission bootstrap, the loopback
# bind and the readiness frame - are ordinary code in src/server.ts now, and
# its build/dev roles moved to `vite build` + @flue/vite.
#
# @flue/runtime — two changes, one rule: a retry budget may only be lengthened
#   once the retry is visible, and invisible retry must stay short.
#
#   1. conversation-projections-*.mjs — replaces the transient-model-error
#      classifier inline in the bundle with a delegation to pi-ai's
#      isRetryableAssistantError. The shipped regex missed genuinely transient
#      wordings (OpenRouter's "Provider returned error" among them), which then
#      were never retried, and had no quota/billing guard, so OpenAI's
#      insufficient_quota (an HTTP 429) burned three retries before the person
#      saw the one sentence that could help.
#
#   2. conversation-stream-store-*.mjs + flue-app-*.mjs — makes each scheduled
#      transient retry VISIBLE and its budget PER-CLASS. waitForTransientModelRetry
#      used to write only an internal log line under one shipped budget; since
#      Task 29 it also appends a submission_retry_scheduled record carrying wire
#      facts only (attempt, maxRetries, delayMs, the failed attempt's error
#      sentence), which encodeRecord projects into a `submission-retrying`
#      chunk. Since Task 30 the budget and wait for each attempt come from
#      src/reliability/model-retry-policy.ts — rate-limit 8 retries, transport
#      2, everything else 3 — consulted on
#      globalThis.__projectStudioTransientModelRetryPolicy, because this bundle
#      cannot import our source from pnpm's virtual store. An absent,
#      malformed or throwing policy falls back to the shipped constants, so
#      the fallback path is exactly the pre-Task-30 behaviour. The exhausted
#      branch still emits nothing — there is no wait to announce, and the
#      settlement carries the failure. The bundle filenames carry content
#      hashes, so an upgrade fails this patch loudly rather than silently;
#      the patch file itself says how to re-derive each hunk, and
#      documentation/architecture/retry.md holds the map this belongs to.
# Runtime patch state after Phase 2 (the Flue 2.0 pins): the hunks in
# patches/@flue__runtime@1.0.0-beta.9.patch are anchored to beta.9 bundle
# hashes and CANNOT apply to @flue/runtime@2.0.3 - pnpm fails the install
# with ERR_PNPM_PATCH_FAILED, which is the loud, designed failure the
# migration plan asked for. The patch file is kept on disk for Phase 8 to
# re-derive against the 2.0.3 bundles.
#
# Until Phase 8 lands, this is a REAL, NAMED REGRESSION, accepted on purpose:
#   - transient-model-error classification is upstream's regex again (no
#     delegation to pi-ai's isRetryableAssistantError, no quota/billing guard,
#     so OpenAI's insufficient_quota burns retries);
#   - scheduled transient retries are INVISIBLE again (internal log only, no
#     submission_retry_scheduled record) with ONE shipped budget of 3 and
#     upstream's own delay curve - src/reliability/model-retry-policy.ts is
#     installed on globalThis but nothing reads it;
#   - composeSystemPrompt re-adds its unstable `Date:` line, cwd, directory
#     listing and the `## Available Agents` section (Phase 8 decides).
#
# Do not re-add the entry before Phase 8 re-derives the hunks: an install
# that cannot complete is not a tree anyone can build from.
