# Where pnpm 11 reads settings that pnpm 10 read from package.json.
#
# The `pnpm` field in package.json is no longer read, so `overrides` moved
# here. `patchedDependencies` is declared here too: it had never been written
# in a manifest at all, and survived only because the lockfile remembered it -
# one clean reinstall away from the Flue runtime patch silently not applying.
overrides:
  '@earendil-works/pi-ai': ^0.84.0

patchedDependencies:
  '@flue/runtime@2.0.3': patches/@flue__runtime@2.0.3.patch

# Every dependency that ships an install script, answered explicitly.
#
# pnpm 10 printed an unanswered list as a warning; pnpm 11 fails the command
# on it, so silence is no longer an option. `false` for all six keeps exactly
# the behavior this project has always run and tested under - none of these
# scripts has ever executed here. Flip one to `true` only with a reason.
allowBuilds:
  '@google/genai': false
  '@mongodb-js/zstd': false
  core-js-pure: false
  esbuild: false
  node-liblzma: false
  protobufjs: false
