packages:
  - .

# Pin one Pi release across the runtime and host, so provider and agent
# collections share model, credential and transcript contracts.
overrides:
  '@earendil-works/pi-ai': 1.2.0
  '@earendil-works/pi-agent-core': 1.2.0

allowBuilds:
  '@google/genai': false
  '@mongodb-js/zstd': false
  core-js-pure: false
  esbuild: true
  node-liblzma: false
  protobufjs: false
  sharp: false
  workerd: true

minimumReleaseAgeExclude:
  - '@earendil-works/pi-ai@1.2.0'
  - '@earendil-works/pi-telemetry@1.2.0'
  - '@earendil-works/pi-agent-core@1.2.0'

# The @flue/runtime and @flue/sdk idempotency patches were removed under
# meta-task #12. The @flue/cli patch died with the Flue 2.0 pins (Phases 2
# and 3): its three behaviours - the fd admission bootstrap, the loopback
# bind and the readiness frame - are ordinary code in src/server.ts now, and
# its build/dev roles moved to `vite build` + @flue/vite.
#
# @flue/runtime@2.3.0 - a retry budget may only be lengthened once the retry
#   is visible, and invisible retry must stay short. Rebased from the 2.0.3
#   patch onto the 2.3.0 bundles and Pi 1.2.0. pnpm fails the whole install
#   if a hunk stops applying, which is the point.
#
#   1. conversation-stream-store-*.mjs, waitForTransientModelRetry - each
#      scheduled transient retry appends a `submission_retry_scheduled`
#      record carrying wire facts only (attempt, maxRetries, delayMs, the
#      failed attempt's error sentence), which hunk 4 projects into a
#      `submission-retrying` chunk. The budget and the wait for each attempt
#      come from src/reliability/model-retry-policy.ts - rate-limit 8
#      retries, transport 2, everything else 3 - consulted on
#      globalThis.__projectStudioTransientModelRetryPolicy, because this
#      bundle executes from pnpm's virtual store and cannot import our
#      source. An absent, malformed or throwing policy falls back to the
#      shipped constants of three and upstream's own delay curve, so the
#      fallback path is exactly the pre-Task-30 behaviour. The exhausted
#      branch still emits nothing - there is no wait to announce, and the
#      settlement carries the failure.
#
#   2. dispatch-*.mjs, isRetryableModelError - the heuristic half of the
#      transient-model-error classifier is delegated to pi-ai's
#      isRetryableAssistantError instead of the inline regex, which missed
#      genuinely transient wordings (OpenRouter's "Provider returned error"
#      among them) and had no quota/billing guard, so OpenAI's
#      insufficient_quota (an HTTP 429) burned three retries before the
#      person saw the one sentence that could help. Upstream's
#      stopReason/errorMessage precondition and its (retryable_interruption)
#      marker check stay in front of the delegation.
#
#   3. dispatch-*.mjs, projectConversationUi - an errored assistant attempt
#      keeps its own message in the history projection instead of folding
#      into the response that replaced it. Without this a retry is
#      invisible in BOTH channels at once: no `submission-retrying` chunk
#      and no failed attempt to look at, which is what made a retrying turn
#      indistinguishable from a hung one. The 2.3.0 patch retains Studio's
#      separate failed attempts rather than hiding superseded model content.
#
#   4. dispatch-*.mjs, encodeRecord - projects `submission_retry_scheduled`
#      into a `submission-retrying` chunk. Unknown record types project to
#      nothing by design, so the one record Studio itself adds needs its own
#      case beside the other submission_* cases.
#
#   5. conversation-stream-store-*.mjs, composeSystemPrompt - removes the
#      compose-time `Date:` line and the bare `Working directory:` line,
#      which duplicated facts the studio agent's own `# Environment` block
#      already carries (one authority per fact; the block is ours). The
#      `## Available Agents` section and the directory listing stay: the
#      `task` tool is always registered and its description points the model
#      at that section, and the listing is a fact ours does not carry.
#      Measured before deciding: the shipped `Date:` line is day-granular
#      and tail-positioned, so it never actually defeated per-turn prompt
#      caching - the reason for removal is duplication, not caching.
#
#   6. dispatch-*.mjs, projectConversationUi and
#      projectAgentConversationSnapshot - the compaction records on the
#      active path are projected into the history snapshot as
#      `compactions`, each naming the projected message it follows and
#      the entry the model's memory now begins at. Upstream skips the
#      record in the UI walk and answers a compaction with a snapshot
#      reset that carries no trace of it, so a client could never show
#      where a conversation was shortened, or what the summary kept. The
#      messages before the cut are still projected; the record is a marker
#      beside them, not a cut in what the person can read.
#
#   7. builtin-providers-*.mjs, createNodeAgentCoordinator - `compactInstance`
#      opens one agent instance's session exactly as a submission opens it
#      and runs the engine's own `session.compact()` (`runCompaction
#      ("manual")`), refusing with SessionBusyError while a submission is
#      queued or running; the claim loop yields to a compaction in flight.
#      dispatch-*.mjs publishes it as
#      globalThis.__projectStudioCompactAgentInstance, beside
#      getAgentInstance, because the chunk's export map is minified;
#      conversation-stream-store-*.mjs exports the session handler factory
#      under a long name for the same reason. Upstream 2.0.3 has the manual
#      path complete and no door to it from outside a running agent.
#
#   8. dispatch-*.mjs, assertCompaction / runSummarizationCall /
#      generateSummary, and the `compact` call in
#      conversation-stream-store-*.mjs - `compaction.prompts` on the model
#      config: the summariser's system, summary, update and turn-prefix
#      prompts and its reasoning level, each defaulting to the shipped one.
#      types-*.d.mts declares the field. Studio's own prompts live in
#      src/context/compaction-prompt.ts; the engine's are a fixed constant
#      upstream with no hook.
#
#   9. builtin-providers-*.mjs, createTaskSession - the delegate's catalog
#      name lands on the child session's execution context as
#      `subagentName`, beside the taskId (Stage 3's one budgeted hunk, ADR
#      0058 D4's mechanism). Stock 2.0.3 leaves the child's context
#      inheriting the parent's agentName - correct for "who owns this
#      durable work", wrong for "who is acting now" - and the host's
#      tools() callback and the delegate-scope substitution need the
#      acting half. `agentName` is deliberately NOT changed (the
#      submission's agent, unchanged); observation-*.d.mts declares the
#      field so the host's interceptor reads it typed.
#      types-*.d.mts, SubagentDefinition - `model?`/`thinkingLevel?` gain
#      `| undefined`, aligning the declaration with the
#      exactOptionalPropertyTypes discipline the host compiles under; the
#      runtime never writes undefined, only omits.
#
#   10. sql-agent-execution-store-*.mjs and dispatch-*.mjs - deliveryMode
#       separates queued follow-ups from steering. The SQL owner skips queue
#       rows before claiming joins and caps them at three during admission.
#       Promotion, cancellation and edit withdrawal are atomic and apply
#       only while a row remains queued. tests/integration/stop.test.ts pins
#       separate delivery, image restoration and refusal after a run starts.
#
#   How to re-derive at the next upgrade: every hunk carries its own recipe
#   in a `[project-studio patch]` comment, and every recipe says to anchor
#   on content, never on a bundle filename - 2.0.3 moved encodeRecord out of
#   flue-app-*.mjs into dispatch-*.mjs, and a filename anchor is exactly
#   what died with beta.9. Read the failed hunks against the new tarball,
#   re-anchor on the named functions and structures, and re-read
#   documentation/architecture/retry.md, whose row 1 is the map this patch
#   belongs to. The retry behaviours in tests/integration/harness.test.ts
#   pin all of it end to end; they ran red for the whole 2.0.3 window and
#   came back green the day this patch landed.
patchedDependencies:
  '@earendil-works/pi-ai@1.2.0': patches/@earendil-works__pi-ai@1.2.0.patch
  '@flue/runtime@2.3.0': patches/@flue__runtime@2.3.0.patch
