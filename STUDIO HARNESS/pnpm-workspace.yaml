packages:
  - .

allowBuilds:
  '@google/genai': false
  '@mongodb-js/zstd': false
  esbuild: true
  node-liblzma: false
  protobufjs: false
  sharp: false
  workerd: true

# The @flue/runtime and @flue/sdk idempotency patches were removed under
# meta-task #12. The remaining patch is load-bearing: its hostname hunk is the
# only thing that supplies the loopback bind address, and without it Flue binds
# every interface (ADR 0028).
patchedDependencies:
  '@flue/cli@1.0.0-beta.9': patches/@flue__cli@1.0.0-beta.9.patch
