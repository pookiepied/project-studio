<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Studio Gateway Model Catalogue</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fb;
        --panel: #ffffff;
        --panel-soft: #eef3f8;
        --text: #111827;
        --muted: #64748b;
        --line: #d9e2ec;
        --accent: #0f766e;
        --accent-soft: #d8f3ee;
        --warn: #9a3412;
        --ok: #166534;
        --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid var(--line);
        background: rgba(247, 248, 251, 0.94);
        backdrop-filter: blur(14px);
      }

      .bar,
      main {
        max-width: 1440px;
        margin: 0 auto;
        padding: 18px 24px;
      }

      .title-row,
      .controls,
      .stats,
      .model-head,
      .pill-row,
      .split {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .title-row {
        justify-content: space-between;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: 0;
      }

      .subtle {
        color: var(--muted);
      }

      .controls {
        margin-top: 16px;
        flex-wrap: wrap;
      }

      input,
      select,
      button {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--panel);
        color: var(--text);
        font: inherit;
      }

      input {
        min-width: min(420px, 100%);
        flex: 1 1 320px;
        padding: 0 12px;
      }

      select,
      button {
        padding: 0 10px;
      }

      button {
        cursor: pointer;
      }

      button.active {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: #064e45;
      }

      main {
        display: grid;
        grid-template-columns: 280px 1fr;
        gap: 18px;
      }

      aside,
      .content,
      .raw-panel {
        min-width: 0;
      }

      .panel,
      .model {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .panel {
        padding: 14px;
      }

      .panel + .panel {
        margin-top: 14px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        margin-bottom: 16px;
      }

      .stat {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 12px;
      }

      .stat strong {
        display: block;
        font-size: 24px;
      }

      .list {
        display: grid;
        gap: 10px;
      }

      .model {
        padding: 14px;
      }

      .model-head {
        justify-content: space-between;
        align-items: flex-start;
      }

      .model h2 {
        margin: 0;
        font-size: 16px;
      }

      code {
        overflow-wrap: anywhere;
        color: #334155;
      }

      .pill-row {
        flex-wrap: wrap;
        margin-top: 10px;
      }

      .pill {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel-soft);
        padding: 3px 8px;
        color: #334155;
        font-size: 12px;
      }

      .pill.reasoning {
        border-color: #99d5cb;
        background: var(--accent-soft);
        color: #075148;
      }

      .pill.warn {
        border-color: #fed7aa;
        background: #ffedd5;
        color: var(--warn);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        margin-top: 12px;
      }

      .field {
        border-top: 1px solid var(--line);
        padding-top: 9px;
      }

      .field span {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }

      .field strong {
        display: block;
        overflow-wrap: anywhere;
        font-weight: 600;
      }

      .mini-list {
        margin: 8px 0 0;
        padding: 0;
        list-style: none;
      }

      .mini-list li {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        border-bottom: 1px solid var(--line);
        padding: 6px 0;
      }

      .mini-list li:last-child {
        border-bottom: 0;
      }

      .raw-panel {
        display: none;
      }

      .raw-panel.visible {
        display: block;
      }

      pre {
        max-height: 72vh;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #0f172a;
        color: #e2e8f0;
        padding: 16px;
        font-size: 12px;
      }

      @media (max-width: 980px) {
        main {
          grid-template-columns: 1fr;
        }

        .stats,
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 620px) {
        .bar,
        main {
          padding: 14px;
        }

        .title-row,
        .model-head {
          display: block;
        }

        .stats,
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <div class="title-row">
          <div>
            <h1>Studio Gateway Model Catalogue</h1>
            <div class="subtle" id="sourceLine">Loading registry snapshot...</div>
          </div>
          <div class="split">
            <button id="reloadApi" title="Try loading from a local /v1/models endpoint">Fetch /v1/models</button>
            <button id="toggleRaw">Raw JSON</button>
          </div>
        </div>
        <div class="controls">
          <input id="search" placeholder="Search model, provider, developer, family, capability..." />
          <select id="providerFilter"></select>
          <select id="categoryFilter"></select>
          <select id="reasoningFilter">
            <option value="all">All reasoning</option>
            <option value="supported">Reasoning supported</option>
            <option value="none">No reasoning</option>
            <option value="unknown">Unknown reasoning</option>
          </select>
          <select id="capabilityFilter"></select>
        </div>
      </div>
    </header>

    <main>
      <aside>
        <section class="panel">
          <strong>Providers</strong>
          <ul class="mini-list" id="providerSummary"></ul>
        </section>
        <section class="panel">
          <strong>Categories</strong>
          <ul class="mini-list" id="categorySummary"></ul>
        </section>
        <section class="panel">
          <strong>Reasoning</strong>
          <ul class="mini-list" id="reasoningSummary"></ul>
        </section>
      </aside>

      <section class="content">
        <div class="stats">
          <div class="stat"><span class="subtle">Visible</span><strong id="visibleCount">0</strong></div>
          <div class="stat"><span class="subtle">Total</span><strong id="totalCount">0</strong></div>
          <div class="stat"><span class="subtle">Providers</span><strong id="providerCount">0</strong></div>
          <div class="stat"><span class="subtle">Reasoning</span><strong id="reasoningCount">0</strong></div>
        </div>
        <div class="raw-panel" id="rawPanel"><pre id="rawJson"></pre></div>
        <div class="list" id="modelList"></div>
      </section>
    </main>

    <script src="./model-browser-data.js"></script>
    <script>
      const state = {
        registry: window.__MODEL_REGISTRY__,
        showRaw: false
      };

      const elements = {
        sourceLine: document.querySelector("#sourceLine"),
        search: document.querySelector("#search"),
        providerFilter: document.querySelector("#providerFilter"),
        categoryFilter: document.querySelector("#categoryFilter"),
        reasoningFilter: document.querySelector("#reasoningFilter"),
        capabilityFilter: document.querySelector("#capabilityFilter"),
        providerSummary: document.querySelector("#providerSummary"),
        categorySummary: document.querySelector("#categorySummary"),
        reasoningSummary: document.querySelector("#reasoningSummary"),
        visibleCount: document.querySelector("#visibleCount"),
        totalCount: document.querySelector("#totalCount"),
        providerCount: document.querySelector("#providerCount"),
        reasoningCount: document.querySelector("#reasoningCount"),
        modelList: document.querySelector("#modelList"),
        rawPanel: document.querySelector("#rawPanel"),
        rawJson: document.querySelector("#rawJson"),
        reloadApi: document.querySelector("#reloadApi"),
        toggleRaw: document.querySelector("#toggleRaw")
      };

      elements.search.addEventListener("input", render);
      elements.providerFilter.addEventListener("change", render);
      elements.categoryFilter.addEventListener("change", render);
      elements.reasoningFilter.addEventListener("change", render);
      elements.capabilityFilter.addEventListener("change", render);
      elements.toggleRaw.addEventListener("click", () => {
        state.showRaw = !state.showRaw;
        elements.toggleRaw.classList.toggle("active", state.showRaw);
        render();
      });
      elements.reloadApi.addEventListener("click", loadFromApi);

      hydrate();

      async function loadFromApi() {
        try {
          const response = await fetch("/v1/models");
          if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
          state.registry = await response.json();
          hydrate();
        } catch (error) {
          alert(`Could not fetch /v1/models from this origin. Open the gateway dev URL and try this file from there, or use the embedded snapshot.\n\n${error.message}`);
        }
      }

      function hydrate() {
        const models = getModels();
        fillSelect(elements.providerFilter, "All providers", unique(models.map((model) => model.provider)));
        fillSelect(elements.categoryFilter, "All categories", unique(models.map((model) => model.registry?.category ?? "unknown")));
        fillSelect(elements.capabilityFilter, "All capabilities", unique(models.flatMap((model) => model.capabilities?.modalities ?? [])));
        elements.rawJson.textContent = JSON.stringify(state.registry, null, 2);
        render();
      }

      function render() {
        const models = filteredModels();
        const allModels = getModels();
        const providers = unique(allModels.map((model) => model.provider));
        const reasoningModels = allModels.filter((model) => model.registry?.reasoning?.supported || model.capabilities?.chat?.reasoning?.supported);

        elements.sourceLine.textContent = `${state.registry?.source ?? "unknown"} / ${state.registry?.registryVersion ?? state.registry?.version ?? "unversioned"} / ${allModels.length} models`;
        elements.visibleCount.textContent = models.length;
        elements.totalCount.textContent = allModels.length;
        elements.providerCount.textContent = providers.length;
        elements.reasoningCount.textContent = reasoningModels.length;
        elements.rawPanel.classList.toggle("visible", state.showRaw);
        elements.rawJson.textContent = JSON.stringify(state.registry, null, 2);

        renderSummary(elements.providerSummary, countBy(allModels, (model) => model.provider));
        renderSummary(elements.categorySummary, countBy(allModels, (model) => model.registry?.category ?? "unknown"));
        renderSummary(elements.reasoningSummary, {
          supported: reasoningModels.length,
          none: allModels.filter((model) => model.registry?.reasoning && !model.registry.reasoning.supported).length,
          unknown: allModels.filter((model) => model.capabilities?.chat?.reasoning?.source === "unknown").length
        });

        elements.modelList.innerHTML = models.map(renderModel).join("");
      }

      function filteredModels() {
        const query = elements.search.value.trim().toLowerCase();
        return getModels().filter((model) => {
          const provider = elements.providerFilter.value;
          const category = elements.categoryFilter.value;
          const capability = elements.capabilityFilter.value;
          const reasoning = elements.reasoningFilter.value;

          if (provider && model.provider !== provider) return false;
          if (category && (model.registry?.category ?? "unknown") !== category) return false;
          if (capability && !(model.capabilities?.modalities ?? []).includes(capability)) return false;
          if (!matchesReasoning(model, reasoning)) return false;
          if (!query) return true;
          return JSON.stringify(model).toLowerCase().includes(query);
        });
      }

      function matchesReasoning(model, filter) {
        const registryReasoning = model.registry?.reasoning;
        const chatReasoning = model.capabilities?.chat?.reasoning;
        const supported = Boolean(registryReasoning?.supported || chatReasoning?.supported);
        const unknown = chatReasoning?.source === "unknown";
        if (filter === "supported") return supported;
        if (filter === "none") return !supported && !unknown;
        if (filter === "unknown") return unknown;
        return true;
      }

      function renderModel(model) {
        const chat = model.capabilities?.chat;
        const reasoning = model.registry?.reasoning;
        const efforts = reasoning?.effortValues ?? chat?.reasoning?.efforts ?? [];
        const capabilities = model.capabilities?.modalities ?? [];
        const status = model.registry?.status ?? "unknown";
        const category = model.registry?.category ?? "unknown";
        const pricing = model.registry?.pricing;
        const reasoningLabel = reasoning?.supported || chat?.reasoning?.supported
          ? `reasoning: ${efforts.length ? efforts.join(", ") : "supported"}`
          : chat?.reasoning?.source === "unknown"
            ? "reasoning: unknown"
            : "reasoning: no";

        return `
          <article class="model">
            <div class="model-head">
              <div>
                <h2>${escapeHtml(model.displayName ?? model.id)}</h2>
                <code>${escapeHtml(model.id)}</code>
              </div>
              <div class="pill-row">
                <span class="pill">${escapeHtml(model.provider)}</span>
                <span class="pill ${status !== "active" ? "warn" : ""}">${escapeHtml(status)}</span>
              </div>
            </div>
            <div class="pill-row">
              <span class="pill">${escapeHtml(category)}</span>
              <span class="pill reasoning">${escapeHtml(reasoningLabel)}</span>
              ${capabilities.map((capability) => `<span class="pill">${escapeHtml(capability)}</span>`).join("")}
            </div>
            <div class="grid">
              ${field("Provider model ID", model.providerModelId)}
              ${field("Pricing", formatPricing(pricing))}
              ${field("Pricing status", pricing?.status?.replaceAll?.("_", " ") ?? "N/A")}
              ${field("Billing unit", pricing?.billingUnit?.replaceAll?.("_", " ") ?? "N/A")}
              ${field("Developer", model.registry?.developer)}
              ${field("Family", model.registry?.family)}
              ${field("Context", numberish(model.contextWindow))}
              ${field("Max output", numberish(model.maxTokens))}
              ${field("Input", (model.inputTypes ?? []).join(", "))}
              ${field("Output", (model.outputTypes ?? []).join(", "))}
              ${field("Verification", model.registry?.verificationLevel)}
            </div>
          </article>
        `;
      }

      function field(label, value) {
        return `<div class="field"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value || "n/a")}</strong></div>`;
      }

      function formatPricing(pricing) {
        if (!pricing || pricing.status === "not_applicable") return "N/A";
        if (pricing.kind === "token" || pricing.kind === "embedding") {
          return `in ${money(pricing.inputPerMillion)} / out ${money(pricing.outputPerMillion)} per 1M`;
        }
        if (pricing.price === null || pricing.price === undefined) {
          return `${String(pricing.status ?? "unknown").replaceAll("_", " ")} / ${String(pricing.billingUnit ?? "unit").replaceAll("_", " ")}`;
        }
        return `${money(pricing.price)} / ${String(pricing.billingUnit ?? "unit").replaceAll("_", " ")}`;
      }

      function money(value) {
        return value === null || value === undefined ? "N/A" : `$${numberish(value)}`;
      }

      function renderSummary(target, counts) {
        target.innerHTML = Object.entries(counts)
          .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
          .map(([label, count]) => `<li><span>${escapeHtml(label)}</span><strong>${count}</strong></li>`)
          .join("");
      }

      function fillSelect(select, label, values) {
        select.innerHTML = `<option value="">${escapeHtml(label)}</option>` + values.map((value) => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join("");
      }

      function getModels() {
        return state.registry?.data ?? state.registry?.models ?? [];
      }

      function countBy(items, mapper) {
        return items.reduce((counts, item) => {
          const key = mapper(item);
          counts[key] = (counts[key] ?? 0) + 1;
          return counts;
        }, {});
      }

      function unique(values) {
        return Array.from(new Set(values.filter(Boolean))).sort();
      }

      function numberish(value) {
        return typeof value === "number" ? value.toLocaleString() : value;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
    </script>
  </body>
</html>
